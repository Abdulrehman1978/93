services:
  # ============================================================================
  # 1. Canonical Relational Database (PostgreSQL 16)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: sambal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sambal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sambal_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sambal_db}
    ports:
      - "${POSTGRES_PORT:-5493}:5432"
    volumes:
      - sambal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sambal_user -d sambal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sambal-network

  # ============================================================================
  # 2. S3-Compatible Ephemeral Storage (MinIO)
  # ============================================================================
  s3:
    image: quay.io/minio/minio:latest
    container_name: sambal-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sambal_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sambal_minio_secret_key_2026}
    ports:
      - "9093:9000"
      - "9193:9001"
    volumes:
      - sambal_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sambal-network

  # ============================================================================
  # 3. FastAPI Modular Monolith Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sambal-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sambal_user}:${POSTGRES_PASSWORD:-sambal_secure_pass}@db:5432/${POSTGRES_DB:-sambal_db}
      S3_ENDPOINT_URL: http://s3:9000
    ports:
      - "${BACKEND_PORT:-8093}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sambal-network

  # ============================================================================
  # 4. Next.js PWA Client Surfaces
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sambal-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3093}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sambal-network

volumes:
  sambal_pgdata:
  sambal_miniodata:

networks:
  sambal-network:
    driver: bridge
