name: SAMBAL Monorepo CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gates:
    name: Backend Quality Gates (FastAPI & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sambal_user
          POSTGRES_PASSWORD: sambal_secure_pass
          POSTGRES_DB: sambal_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Ruff Format Check
        run: |
          cd backend
          ruff format --check .

      - name: Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Mypy Strict Type Check
        run: |
          cd backend
          mypy app

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://sambal_user:sambal_secure_pass@localhost:5432/sambal_db
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest -v --cov=app

      - name: Verify OpenAPI Schema Generation
        run: |
          cd backend
          python -c "from app.main import app; schema = app.openapi(); assert len(schema['paths']) > 0; print('OpenAPI paths:', len(schema['paths']))"

  frontend-quality-gates:
    name: Frontend Quality Gates (Next.js & Shared Contracts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Prettier Format Check
        run: npm run format:check

      - name: Build Shared Contracts
        run: npm --workspace=packages/contracts run build

      - name: Strict Typecheck (Contracts & Web)
        run: npm run typecheck

      - name: Next.js ESLint
        run: npm run lint

      - name: Vitest Unit & Component Tests
        run: npm run test

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Axe A11y Tests
        run: npm run test:e2e

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
